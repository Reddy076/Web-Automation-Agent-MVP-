<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>web-agent MVP</title>
<style>body{font-family:system-ui;margin:24px;max-width:900px}input,button{padding:10px;font-size:15px}img{max-width:100%;border:1px solid #ddd}pre{background:#f5f5f5;padding:12px;overflow:auto}</style>
</head><body>
<h2>Web Automation Agent (MVP)</h2>
<input id="url" size="50" value="https://example.com">
<br><br>
<input id="task" size="50" value="get headings and any prices from this page">
<button onclick="run()">Run</button>
<p id="status"></p>
<div id="shots"></div>
<pre id="out"></pre>
<script>
async function run(){
  document.getElementById('status').textContent='running... (30s max)';
  document.getElementById('out').textContent='';
  document.getElementById('shots').innerHTML='';
  const r = await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({task:task.value,url:url.value})});
  const j = await r.json();
  document.getElementById('status').textContent = r.ok ? 'done: '+j.run_id : 'error: '+JSON.stringify(j);
  document.getElementById('out').textContent = JSON.stringify(j,null,2).slice(0,12000);
  if(j.result?.screenshot_b64){
    const img=document.createElement('img');
    img.src='data:image/png;base64,'+j.result.screenshot_b64;
    document.getElementById('shots').appendChild(img);
  }
}
</script></body></html>
